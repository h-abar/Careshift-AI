name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: careshift
          POSTGRES_PASSWORD: careshift_ci
          POSTGRES_DB: careshift
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U careshift -d careshift"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://careshift:careshift_ci@localhost:5432/careshift
      SESSION_SECRET: ci-session-secret-0123456789abcdef0123456789

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test            # vitest — migrations+seed run against the postgres service ("test" schema)
      - run: npm run build
      - run: npm audit --audit-level=high
      - run: npm run license:check

  e2e:
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: careshift
          POSTGRES_PASSWORD: careshift_ci
          POSTGRES_DB: careshift
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U careshift -d careshift"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://careshift:careshift_ci@localhost:5432/careshift
      SESSION_SECRET: ci-session-secret-0123456789abcdef0123456789

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: careshift-ai:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
